<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Model Viewer - ระบบดูโมเดล 3 มิติ 360°</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-panel: rgba(15, 23, 42, 0.85);
      --border-glass: rgba(255, 255, 255, 0.14);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #1e293b 0%, #090d16 80%);
      color: var(--text-main);
      font-family: 'Prompt', 'Sarabun', sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: transparent;
      --poster-color: transparent;
      outline: none;
    }

    .top-bar {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .model-info-card {
      pointer-events: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 10px 16px;
      max-width: min(440px, calc(100vw - 120px));
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .model-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 4px;
      letter-spacing: 0.03em;
    }

    .model-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.3;
      color: #fff;
    }

    .model-desc {
      font-family: 'Sarabun', sans-serif;
      font-size: 0.84rem;
      color: var(--text-sub);
      margin-top: 3px;
      line-height: 1.4;
    }

    .top-actions {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }

    .icon-btn {
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      height: 40px;
      padding: 0 13px;
      border-radius: 12px;
      font-family: 'Prompt', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .icon-btn:hover, .icon-btn.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.18);
      color: #fff;
    }

    .tools-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    body.minimal-mode .model-info-card,
    body.minimal-mode .tools-group,
    body.minimal-mode .touch-hint {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
    }

    .bottom-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: calc(100vw - 24px);
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .touch-hint {
      font-size: 0.75rem;
      color: rgba(248, 250, 252, 0.7);
      background: rgba(15, 23, 42, 0.65);
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      transition: opacity 0.25s ease;
    }

    .switcher-dock {
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      width: 100%;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-glass);
      padding: 6px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
    }

    .model-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-sub);
      padding: 10px 8px;
      border-radius: 11px;
      font-family: 'Prompt', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      transition: all 0.2s ease;
      line-height: 1.2;
    }

    .model-tab .tab-icon {
      font-size: 1.15rem;
    }

    .model-tab:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .model-tab.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(11, 15, 25, 0.72);
      backdrop-filter: blur(6px);
      z-index: 15;
      transition: opacity 0.3s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 0.92rem;
      font-weight: 500;
      color: #fff;
    }

    .progress-track {
      width: 220px;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.15s ease;
    }

    .ar-btn {
      position: fixed;
      bottom: 95px;
      right: 16px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      padding: 10px 18px;
      font-family: 'Prompt', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
      cursor: pointer;
      z-index: 25;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .qr-modal {
      background: #111827;
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 22px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .qr-modal h3 {
      font-size: 1.05rem;
      margin-bottom: 4px;
      color: #fff;
    }

    .qr-modal p {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 14px;
    }

    .qr-box {
      background: #ffffff;
      padding: 16px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .qr-url-preview {
      font-size: 0.72rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 6px 10px;
      border-radius: 8px;
      word-break: break-all;
      margin-bottom: 14px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #090d16;
      border: none;
      padding: 9px 14px;
      border-radius: 10px;
      font-family: 'Prompt', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--border-glass);
      padding: 9px 14px;
      border-radius: 10px;
      font-family: 'Prompt', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .model-title { font-size: 0.95rem; }
      .model-desc { font-size: 0.78rem; }
      .model-tab { font-size: 0.78rem; padding: 9px 6px; }
      .icon-btn span.btn-label { display: none; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="model-info-card">
      <span class="model-badge" id="modelBadge">MODEL 1 / 2</span>
      <div class="model-title" id="modelTitle">กำลังโหลดโมเดล...</div>
      <div class="model-desc" id="modelDesc">ใช้ 1 นิ้วลากเพื่อหมุน 360° • 2 นิ้วถ่างเพื่อซูม</div>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="btnToggleMinimal" title="ซ่อน/แสดงแถบข้อมูล (โหมดคลีน)">
        <span id="minimalIcon">👁️</span>
        <span class="btn-label" id="minimalText">โหมดคลีน</span>
      </button>

      <div class="tools-group">
        <button class="icon-btn active" id="btnAutoRotate" title="เปิด/ปิดหมุนอัตโนมัติ">
          <span>🔄</span>
          <span class="btn-label">หมุนอัตโนมัติ</span>
        </button>
        <button class="icon-btn" id="btnResetCam" title="รีเซ็ตมุมกล้อง">
          <span>🎯</span>
          <span class="btn-label">รีเซ็ตมุมกล้อง</span>
        </button>
        <button class="icon-btn" id="btnShowQR" title="แสดง QR Code ของโมเดลนี้">
          <span>📱</span>
          <span class="btn-label">QR โมเดลนี้</span>
        </button>
        <a class="icon-btn" href="qr.html" title="เปิดหน้าใบรวม QR Code ทั้งหมด (พิมพ์ A4)">
          <span>🖨️</span>
          <span class="btn-label">รวม QR ทั้งหมด</span>
        </a>
      </div>
    </div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">กำลังโหลดโมเดล 3D... 0%</div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <model-viewer
    id="viewer"
    src=""
    alt="3D Interactive Model"
    camera-controls
    touch-action="none"
    auto-rotate
    auto-rotate-delay="1000"
    rotation-per-second="18deg"
    shadow-intensity="1.1"
    shadow-softness="0.8"
    exposure="1.05"
    environment-image="neutral"
    ar
    ar-modes="webxr scene-viewer quick-look"
    max-camera-orbit="auto 100deg auto"
    min-camera-orbit="auto 0deg auto"
  >
    <button slot="ar-button" class="ar-btn">
      📷 วางโมเดลในสถานที่จริง (AR)
    </button>
  </model-viewer>

  <div class="bottom-bar">
    <div class="touch-hint">👆 ลากเพื่อหมุนดู 360° • 🤏 ถ่าง 2 นิ้วเพื่อซูม • เลือกสลับโมเดลด้านล่าง</div>
    <div class="switcher-dock" id="switcherDock">
      <button class="model-tab" data-id="utility_pole">
        <span class="tab-icon">⚡</span>
        <span>เสาไฟฟ้าริมถนน (กทม.)</span>
      </button>
      <button class="model-tab" data-id="ee_building">
        <span class="tab-icon">🏢</span>
        <span>อาคารวิศวกรรมไฟฟ้า</span>
      </button>
    </div>
  </div>

  <div class="modal-backdrop" id="qrModal">
    <div class="qr-modal">
      <h3 id="qrModalTitle">QR Code โมเดลนี้</h3>
      <p>ใช้กล้องมือถือหรือแอป LINE สแกนเพื่อเปิดโมเดลชิ้นนี้ได้ทันที</p>
      <div class="qr-box" id="qrContainer"></div>
      <div class="qr-url-preview" id="qrUrlText"></div>
      <div class="modal-actions">
        <button class="btn-primary" id="btnDownloadQR">⬇️ ดาวน์โหลด QR (.png)</button>
        <a class="btn-secondary" href="qr.html">🖨️ หน้าพิมพ์ QR ทั้งหมด</a>
        <button class="btn-secondary" id="btnCloseModal">ปิด</button>
      </div>
    </div>
  </div>

  <script>
    const MODELS = {
      utility_pole: {
        index: 1,
        title: "เสาไฟฟ้าริมถนนและสภาพแวดล้อม (กทม.)",
        desc: "จำลองระบบจำหน่ายไฟฟ้า หม้อแปลง สายไฟ ป้ายซอย และอาคารพาณิชย์ริมถนน (พร้อมสีและพื้นผิวจริง)",
        file: "models/bkk_utility_pole_street.glb",
        orbit: "35deg 72deg 105%"
      },
      ee_building: {
        index: 2,
        title: "อาคารวิศวกรรมไฟฟ้า (Electrical Engineering Building)",
        desc: "โมเดลสถาปัตยกรรมอาคารเรียนและปฏิบัติการวิศวกรรมไฟฟ้าแบบ 3 มิติ (พร้อมสีและพื้นผิวจริง)",
        file: "models/electrical_engineering_building.glb",
        orbit: "-35deg 70deg 110%"
      }
    };

    const viewer = document.getElementById('viewer');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const progressFill = document.getElementById('progressFill');
    const modelBadge = document.getElementById('modelBadge');
    const modelTitle = document.getElementById('modelTitle');
    const modelDesc = document.getElementById('modelDesc');
    const tabs = document.querySelectorAll('.model-tab');

    let currentKey = 'utility_pole';
    let isMinimal = false;
    let isAutoRotate = true;

    function getBaseUrl() {
      const url = new URL(window.location.href);
      url.search = '';
      url.hash = '';
      return url.toString();
    }

    function selectModel(key, updateHistory = true) {
      if (!MODELS[key]) key = 'utility_pole';
      currentKey = key;
      const item = MODELS[key];

      modelBadge.textContent = `MODEL ${item.index} / 2`;
      modelTitle.textContent = item.title;
      modelDesc.textContent = item.desc;

      tabs.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === key);
      });

      loadingOverlay.classList.remove('hidden');
      loadingText.textContent = `กำลังโหลด ${item.title}... 0%`;
      progressFill.style.width = '0%';

      viewer.src = item.file;
      viewer.cameraOrbit = item.orbit;

      if (updateHistory) {
        const newUrl = new URL(window.location.href);
        newUrl.searchParams.set('model', key);
        window.history.replaceState({}, '', newUrl);
      }
    }

    viewer.addEventListener('progress', (e) => {
      const pct = Math.round((e.detail.totalProgress || 0) * 100);
      progressFill.style.width = `${pct}%`;
      loadingText.textContent = `กำลังโหลดโมเดล 3D... ${pct}%`;
      if (pct >= 100) {
        setTimeout(() => loadingOverlay.classList.add('hidden'), 250);
      }
    });

    viewer.addEventListener('load', () => {
      loadingOverlay.classList.add('hidden');
    });

    viewer.addEventListener('error', () => {
      loadingText.textContent = 'เกิดข้อผิดพลาดในการโหลดไฟล์โมเดล 3D';
    });

    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        selectModel(btn.dataset.id);
      });
    });

    const btnToggleMinimal = document.getElementById('btnToggleMinimal');
    const minimalText = document.getElementById('minimalText');
    btnToggleMinimal.addEventListener('click', () => {
      isMinimal = !isMinimal;
      document.body.classList.toggle('minimal-mode', isMinimal);
      btnToggleMinimal.classList.toggle('active', isMinimal);
      minimalText.textContent = isMinimal ? 'แสดงเครื่องมือ' : 'โหมดคลีน';
    });

    const btnAutoRotate = document.getElementById('btnAutoRotate');
    btnAutoRotate.addEventListener('click', () => {
      isAutoRotate = !isAutoRotate;
      if (isAutoRotate) {
        viewer.setAttribute('auto-rotate', '');
      } else {
        viewer.removeAttribute('auto-rotate');
      }
      btnAutoRotate.classList.toggle('active', isAutoRotate);
    });

    document.getElementById('btnResetCam').addEventListener('click', () => {
      const item = MODELS[currentKey];
      viewer.cameraTarget = 'auto auto auto';
      viewer.cameraOrbit = item.orbit;
      viewer.fieldOfView = 'auto';
    });

    const qrModal = document.getElementById('qrModal');
    const qrContainer = document.getElementById('qrContainer');
    const qrUrlText = document.getElementById('qrUrlText');
    const qrModalTitle = document.getElementById('qrModalTitle');

    function openQRModal() {
      const item = MODELS[currentKey];
      const targetUrl = `${getBaseUrl()}?model=${currentKey}`;
      qrModalTitle.textContent = `QR Code: ${item.title}`;
      qrUrlText.textContent = targetUrl;
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: targetUrl,
        width: 210,
        height: 210,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
      qrModal.classList.add('open');
    }

    document.getElementById('btnShowQR').addEventListener('click', openQRModal);
    document.getElementById('btnCloseModal').addEventListener('click', () => {
      qrModal.classList.remove('open');
    });
    qrModal.addEventListener('click', (e) => {
      if (e.target === qrModal) qrModal.classList.remove('open');
    });

    document.getElementById('btnDownloadQR').addEventListener('click', () => {
      const canvas = qrContainer.querySelector('canvas');
      const img = qrContainer.querySelector('img');
      const dataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
      if (!dataUrl) return;
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `QR_${currentKey}.png`;
      a.click();
    });

    const params = new URLSearchParams(window.location.search);
    const initialModel = params.get('model') || 'utility_pole';
    if (params.get('minimal') === '1') {
      isMinimal = true;
      document.body.classList.add('minimal-mode');
      btnToggleMinimal.classList.add('active');
      minimalText.textContent = 'แสดงเครื่องมือ';
    }
    selectModel(initialModel, false);
  </script>
</body>
</html>
